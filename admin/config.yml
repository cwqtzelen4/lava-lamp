backend:
  name: github
  repo: cwqtzelen4/lava-lamp
  branch: main
  base_url: https://lava-lamp-cms-auth.mariasm1913.workers.dev
  auth_endpoint: auth

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "stories"
    label: "Stories"
    folder: "src/stories"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/article.njk" }
      - { label: "Permalink", name: "permalink", widget: "string", pattern: ['^/stories/.*/$', "Must look like /stories/your-slug/"] }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Deck", name: "deck", widget: "text", required: false }
      - { label: "Writer", name: "author", widget: "relation", collection: "authors", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}" }
      - { label: "Illustrator (optional)", name: "illustrator", widget: "relation", collection: "authors", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}", required: false }
      - { label: "Photographer (optional)", name: "photographer", widget: "relation", collection: "authors", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}", required: false }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image Aspect", name: "imageAspect", widget: "select", options: ["landscape", "portrait", "square", "wide"], default: "landscape" }
      - { label: "Cover Image (the thumbnail shown in galleries and story lists)", name: "image", widget: "image", required: false }
      - { label: "Use the Cover Image above the text at the top of the story? (OFF = the text starts straight away, ON = the cover picture appears first)", name: "showTopImage", widget: "boolean", default: false, required: false }
      - { label: "Different image for the top of the story (optional: if you upload one here, it appears above the text by itself)", name: "topImage", widget: "image", required: false }
      - { label: "Caption for the top image (optional)", name: "imageCaption", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "authors"
    label: "Writers"
    folder: "src/authors"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/author.njk" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role (shown as their title; also sets the page address: /writers/, /illustrators/ or /photographers/)", name: "role", widget: "select", options: ["Writer", "Illustrator", "Photographer"], default: "Writer", required: false }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Short bio (one line, shown under the articles - e.g. JMC major who loves hiking)", name: "shortBio", widget: "string", required: false }
      - { label: "Long bio (shown on the person's own profile page - major, interests, anything you like)", name: "bio", widget: "text" }

  - name: "issues"
    label: "Print Issues"
    folder: "src/issues"
    create: true
    slug: "issue-{{fields.number}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "layouts/issue.njk" }
      - { label: "Permalink", name: "permalink", widget: "string", pattern: ['^/print/.*/$', "Must look like /print/your-slug/"] }
      - { label: "Issue Number", name: "number", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Intro (issue detail page)", name: "intro", widget: "text", required: false }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "PDF", name: "pdf", widget: "file", required: false }
      - { label: "Spreads", name: "body", widget: "markdown", required: false }

  - name: "site"
    label: "Site Settings"
    files:
      - label: "General"
        name: "general"
        file: "src/_data/site.json"
        fields:
          - { label: "Name — line 1", name: "nameLine1", widget: "string" }
          - { label: "Name — line 2", name: "nameLine2", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Logo", name: "logo", widget: "image" }
          - { label: "Header Statement Line 1", name: "statementLine1", widget: "string" }
          - { label: "Header Statement Line 2 (optional)", name: "statementLine2", widget: "string", required: false }
          - { label: "Email address (submissions arrive here, and it is shown in the footer Contact pop-up)", name: "email", widget: "string" }
          - { label: "Footer Meta", name: "footerMeta", widget: "string" }
          - label: "Nav Links"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
      - label: "Team"
        name: "team"
        file: "src/_data/team.json"
        fields:
          - label: "Members"
            name: "members"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Linked Writer Page (their photo comes from here)", name: "author", widget: "relation", collection: "authors", search_fields: ["name"], display_fields: ["name"], value_field: "{{slug}}", required: false }
      - label: "Submissions Page"
        name: "submissions"
        file: "src/_data/submissions.json"
        fields:
          - { label: "Text above the form (what we're looking for + submission guidelines)", name: "guidelines", widget: "markdown", editor_components: ["floating-image"] }
          - { label: "Ethics guidelines PDF (shown and linked under 'Ethics Guidelines', below the form)", name: "ethicsPdf", widget: "file", required: false }
